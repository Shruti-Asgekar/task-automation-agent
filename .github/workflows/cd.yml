name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "shrutiasgekar1@gmail.com"
          git config --global user.name "Shruti Asgekar"
          git push --force https://ShRutIAG:${HF_TOKEN}@huggingface.co/spaces/ShRutIAG/task-automation-agent main
